name: Build & Deploy to Coolify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Without this the deploy job runs on the repository's default token
    # permissions and pushing to ghcr fails with "installation not allowed to
    # Create organization package".
    permissions:
      contents: read
      packages: write

    # A secret only reaches a step through `env` when it is mapped here first: an earlier
    # version of this job gated on an env var it never mapped, so Coolify was never told.
    # Coolify 4.1.x rejects a token in the query string, so CI uses the documented bearer
    # header plus the app uuid.
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notify Coolify
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_API_TOKEN:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "::error::Set the COOLIFY_API_TOKEN and COOLIFY_APP_UUID secrets (tools/coolify-provision.sh --set-ci-secrets)."
            exit 1
          fi
          base="${COOLIFY_BASE_URL:-https://app.nramos.dev/api/v1}"
          curl -fsS -m 120 -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${base}/deploy?uuid=${COOLIFY_APP_UUID}"
