server {
    listen 80;
    server_name nicolasramos.es www.nicolasramos.es;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Coolify's Traefik, so nginx sees the request as plain http on :80 and
    # would build absolute Locations like http://host/servicios/ — one extra 302 hop back to
    # https on every redirect. Relative Locations keep the visitor on https.
    absolute_redirect off;
    port_in_redirect off;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Cache Static Assets ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The scroll world streams six mp4 clips on every visit, so they are cached
    # hard. Range requests (what scrubbing relies on) are on by default in nginx.
    location ~* \.(mp4|webp|avif|jpg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Google Search Console Verification ───
    location = /google-site-verification.html {
        try_files /google-site-verification.html =404;
    }

    # ─── Odoo 14 → new URL redirects ───
    # nicolasramos.es used to run Odoo 14. These 301s keep the SEO weight and the
    # inbound links of the old URLs.

    # Main pages — no trailing slash to canonical form. Redirecting a URL to itself
    # (which this config used to do) starts a redirect loop.
    location = /sobre-mi { return 301 /sobre-mi/; }
    location = /about { return 301 /en/about/; }
    location = /servicios { return 301 /servicios/; }
    location = /services { return 301 /en/servicios/; }
    location = /proyectos { return 301 /proyectos/; }
    location = /projects { return 301 /en/proyectos/; }
    location = /contacto { return 301 /contacto/; }
    location = /contact { return 301 /en/contacto/; }
    location = /contactus { return 301 /contacto/; }

    # Blog (Odoo 14) — the blog lives on nramos.dev today
    location /blog/ { return 301 https://nramos.dev/blog/; }
    location = /blog { return 301 https://nramos.dev/blog/; }

    # Odoo backend — access blocked
    location /web { return 410; }
    location /web/login { return 410; }
    location /web/database { return 410; }

    # Old Odoo static/media paths
    location /web/image { return 410; }
    location /web/binary { return 410; }
    location /website/action { return 301 /; }
    location /page/ { return 301 /; }

    # ─── SPA Fallback ───
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ─── Custom Error Pages ───
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
