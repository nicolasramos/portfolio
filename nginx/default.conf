server {
    listen 80;
    server_name nicolasramos.es www.nicolasramos.es;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Cache Static Assets ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Google Search Console Verification ───
    location = /google-site-verification.html {
        try_files /google-site-verification.html =404;
    }

    # ─── Redirecciones Odoo 14 → Nuevas URLs ───
    # El dominio nicolasramos.es estaba en Odoo 14. Estas son las redirecciones
    # 301 para preservar SEO y enlaces existentes.

    # Páginas principales
    location = /sobre-mi { return 301 /sobre-mi; }
    location = /about { return 301 /en/about; }
    location = /servicios { return 301 /servicios; }
    location = /services { return 301 /en/servicios; }
    location = /proyectos { return 301 /proyectos; }
    location = /projects { return 301 /en/proyectos; }
    location = /contacto { return 301 /contacto; }
    location = /contact { return 301 /en/contacto; }
    location = /contactus { return 301 /contacto; }

    # Blog (Odoo 14)
    location /blog { return 301 /blog; }
    location /blog/ { return 301 /blog; }

    # Odoo backend — bloquear acceso
    location /web { return 410; }
    location /web/login { return 410; }
    location /web/database { return 410; }

    # Odoo static/media paths antiguos
    location /web/image { return 410; }
    location /web/binary { return 410; }
    location /website/action { return 301 /; }
    location /page/ { return 301 /; }

    # ─── SPA Fallback ───
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ─── Custom Error Pages ───
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
